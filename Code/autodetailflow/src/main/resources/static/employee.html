
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoDetail Flow - Employee Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #243447;
        }

        .subtitle {
            color: #666;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            background-color: #237a57;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #185c40;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .confirm-button {
            background-color: #237a57;
        }

        .confirm-button:hover {
            background-color: #185c40;
        }

        .decline-button {
            background-color: #c0392b;
        }

        .decline-button:hover {
            background-color: #922b21;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 8px 12px;
            font-size: 13px;
        }

        .table-container {
            background-color: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: top;
        }

        th {
            background-color: #243447;
            color: white;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .confirmed, .scheduled {
            background-color: #d4edda;
            color: #155724;
        }

        .cancelled, .declined {
            background-color: #f8d7da;
            color: #721c24;
        }

        .completed {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .message {
            padding: 20px;
            text-align: center;
            color: #666;
        }

        .contact {
            font-size: 13px;
            color: #555;
            margin-top: 5px;
        }

        .notification {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AutoDetail Flow</h1>
    <p class="subtitle">Employee - Appointment Requests</p>

    <div class="toolbar">
        <h2>Customer Appointments</h2>
        <button onclick="loadAppointments()">
            Refresh Appointments
        </button>
    </div>

    <div id="notification" class="notification"
         role="status" aria-live="polite"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Vehicle</th>
                    <th>Service</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="appointmentTable">
                <tr>
                    <td colspan="8" class="message">
                        Loading appointments...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // Safely display customer-provided text
    function escapeHTML(value) {
        return String(value ?? "").replace(
            /[&<>"']/g,
            character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]
        );
    }

    function formatDate(dateTime) {
        const date = new Date(dateTime);

        return date.toLocaleDateString("en-US", {
            year: "numeric",
            month: "short",
            day: "numeric"
        });
    }

    function formatTime(dateTime) {
        const date = new Date(dateTime);

        return date.toLocaleTimeString("en-US", {
            hour: "numeric",
            minute: "2-digit"
        });
    }

    // Displays success or error messages
    function showNotification(message, isError) {

        const notification =
                document.getElementById("notification");

        notification.textContent = message;

        notification.className = isError
                ? "notification error-message"
                : "notification success-message";

        notification.style.display = "block";
    }

    // Sends confirm or decline request to Spring Boot
    async function updateAppointment(id, action, buttons) {

        if (action === "decline") {
            const approved = confirm(
                "Are you sure you want to decline appointment #" +
                id + "?"
            );

            if (!approved) {
                return;
            }
        }

        // Prevent repeated clicks while processing
        buttons.forEach(button => {
            button.disabled = true;
        });

        try {
            const response = await fetch(
                "/api/appointments/" + id + "/" + action,
                {
                    method: "PATCH"
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.message || "Unable to update appointment"
                );
            }

            showNotification(result.message, false);

            // Refresh the table to show the new status
            await loadAppointments();

        } catch (error) {

            showNotification(error.message, true);

            buttons.forEach(button => {
                button.disabled = false;
            });

            console.error(error);
        }
    }

    async function loadAppointments() {

        const table = document.getElementById(
            "appointmentTable"
        );

        table.innerHTML = `
            <tr>
                <td colspan="8" class="message">
                    Loading appointments...
                </td>
            </tr>
        `;

        try {
            const response = await fetch("/api/appointments", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    "Unable to retrieve appointments"
                );
            }

            const appointments = await response.json();

            table.innerHTML = "";

            if (appointments.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="8" class="message">
                            No appointment requests found.
                        </td>
                    </tr>
                `;
                return;
            }

            // Show newest requests first
            appointments.reverse();

            appointments.forEach(appointment => {

                const customer = appointment.user || {};
                const vehicle = appointment.vehicle || {};
                const service =
                    appointment.detailingPackage || {};

                const status = appointment.status || "Pending";
                const statusClass = status.toLowerCase();

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>
                        ${escapeHTML(appointment.appointmentId)}
                    </td>

                    <td>
                        <strong>${escapeHTML(customer.name)}</strong>
                        <div class="contact">
                            ${escapeHTML(customer.email)}
                        </div>
                        <div class="contact">
                            ${escapeHTML(customer.phoneNumber)}
                        </div>
                    </td>

                    <td>
                        ${escapeHTML(vehicle.year)}
                        ${escapeHTML(vehicle.make)}
                        ${escapeHTML(vehicle.model)}
                        <div class="contact">
                            ${escapeHTML(vehicle.type)}
                        </div>
                    </td>

                    <td>
                        ${escapeHTML(service.packageName)}
                    </td>

                    <td>
                        ${escapeHTML(
                            formatDate(appointment.appointmentDateTime)
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            formatTime(appointment.appointmentDateTime)
                        )}
                    </td>

                    <td>
                        <span class="status ${escapeHTML(statusClass)}">
                            ${escapeHTML(status)}
                        </span>
                    </td>

                    <td class="action-cell"></td>
                `;

                const actionCell =
                        row.querySelector(".action-cell");

                // Only pending appointments can be reviewed
                if (status.toLowerCase() === "pending") {

                    const actions = document.createElement("div");
                    actions.className = "actions";

                    const confirmButton =
                            document.createElement("button");

                    confirmButton.textContent = "Confirm";
                    confirmButton.className = "confirm-button";

                    const declineButton =
                            document.createElement("button");

                    declineButton.textContent = "Decline";
                    declineButton.className = "decline-button";

                    const buttons = [
                        confirmButton,
                        declineButton
                    ];

                    confirmButton.addEventListener("click", () => {
                        updateAppointment(
                            appointment.appointmentId,
                            "confirm",
                            buttons
                        );
                    });

                    declineButton.addEventListener("click", () => {
                        updateAppointment(
                            appointment.appointmentId,
                            "decline",
                            buttons
                        );
                    });

                    actions.appendChild(confirmButton);
                    actions.appendChild(declineButton);

                    actionCell.appendChild(actions);

                } else {
                    actionCell.textContent = "Reviewed";
                }

                table.appendChild(row);
            });

        } catch (error) {

            table.innerHTML = `
                <tr>
                    <td colspan="8" class="message">
                        Error loading appointments.
                        Make sure Spring Boot is running.
                    </td>
                </tr>
            `;

            console.error(error);
        }
    }

    // Load appointments when the page opens
    loadAppointments();
</script>

</body>
</html>
